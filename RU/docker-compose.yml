# File Transfer Wargame — соревновательная лаба (в духе OverTheWire).
# Изоляция: каждый контейнер монтирует ТОЛЬКО свой /flag; scpuser сидит в SFTP-chroot.
# Ч1(0-7) каналы · Ч2(8-14) кодирование · Ч3(15-19) экзотика · Ч4(20-27) сжатие/кодировки · Ч5(28-32) GHOST · 33 финал.

x-level: &level-defaults
  restart: unless-stopped
  networks: [ftw]
  depends_on: [fileserver]

services:
  fileserver:
    build: { context: ., dockerfile: Dockerfile.server }
    container_name: ftwru_fileserver
    hostname: fileserver
    restart: unless-stopped
    volumes: ["./flags:/flags:ro"]
    networks: [ftw]

  level0:
    <<: *level-defaults
    build: { context: ., dockerfile: Dockerfile.level, args: { LEVEL: "0", EXTRA_PKGS: "openssh-client" } }
    container_name: ftwru_level0
    hostname: level0
    ports: ["3220:22"]
    volumes: ["./flags/level0:/flag:ro", "./tasks/level0.txt:/task/task.txt:ro", "./hints/level0.txt:/task/hint.txt:ro", "./info/level0.txt:/task/info.txt:ro"]

  level1:
    <<: *level-defaults
    build: { context: ., dockerfile: Dockerfile.level, args: { LEVEL: "1", EXTRA_PKGS: "curl wget" } }
